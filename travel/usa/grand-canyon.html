<div class="container">

<img
class="travel-hero"
src="../images/usa/grand-canyon/cover.jpg"
alt="Grand Canyon National Park">

<div id="gallery"></div>

</div>

<p>
© 2026 Dipayan Chakraborty
</p>

</footer>

<div id="lightbox">

<span id="lightbox-close">&times;</span>

<img id="lightbox-img">

</div>

<script>

const totalPhotos = 4;

const gallery = document.getElementById("gallery");

for(let i=1;i<=totalPhotos;i++){

    const filename = String(i).padStart(3,"0") + ".jpg";

    gallery.innerHTML += `

    <div class="travel-photo">

        <img
            src="../images/usa/grand-canyon/${filename}"
            loading="lazy"
            alt="Grand Canyon National Park">

    </div>

    `;

}

const images = document.querySelectorAll(".travel-photo img");

images.forEach(img => {

    img.addEventListener("click", () => {

        document.getElementById("lightbox-img").src = img.src;

        document.getElementById("lightbox").style.display = "flex";

    });

});

const lightbox = document.getElementById("lightbox");
const closeBtn = document.getElementById("lightbox-close");

closeBtn.addEventListener("click", (e) => {

    e.stopPropagation();

    lightbox.style.display = "none";

});

lightbox.addEventListener("click", (e) => {

    if(e.target === lightbox){

        lightbox.style.display = "none";

    }

});

</script>
